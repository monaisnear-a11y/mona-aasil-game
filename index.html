<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mona × Aasil — Crorepati</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle,#1c3382,#050918);color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(900px,100%);background:#07102fdd;border:2px solid #e0b52e;border-radius:24px;padding:22px;box-shadow:0 0 35px #0008}h1{text-align:center;color:#ffd94f;margin:0 0 4px}.sub{text-align:center;color:#ccd3ee;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#111d4b;border-radius:16px;padding:18px}.person{text-align:center;font-size:19px}.avatar{font-size:55px}.room{text-align:center;font-size:22px;color:#ffd94f;margin:15px}.question{font-size:21px;text-align:center;padding:20px;border:1px solid #d9ac2c;border-radius:15px;margin:15px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input{width:100%;padding:13px;border-radius:10px;border:1px solid #d9ac2c;font-size:16px}button{background:#142252;color:#fff;cursor:pointer}button:hover{background:#d9ac2c;color:#111}.hidden{display:none}.status{text-align:center;margin:12px;color:#ffd94f;min-height:24px}.big{font-size:30px;text-align:center;color:#ffd94f}@media(max-width:650px){.grid,.answers{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
<h1>🤑 CROREPATI — MONA × AASIL</h1>
<div class="sub">Long-distance friends • Same room • Same question • Real-time 😂</div>

<div id="lobby">
  <div class="grid">
    <div class="panel">
      <div class="person"><div class="avatar">🎤</div><b>Mona</b><br>Host</div>
      <input id="hostName" placeholder="Mona ka naam" value="Mona">
      <button onclick="create()">Create Room</button>
    </div>
    <div class="panel">
      <div class="person"><div class="avatar">🧑</div><b>Aasil</b><br>Contestant</div>
      <input id="playerName" placeholder="Aasil ka naam" value="Aasil">
      <input id="roomCode" placeholder="Room Code">
      <button onclick="join()">Join Room</button>
    </div>
  </div>
  <div class="status" id="lobbyMsg"></div>
</div>

<div id="game" class="hidden">
  <div class="room">Room: <b id="code"></b></div>
  <div class="grid">
    <div class="panel person"><div class="avatar">🎤</div><b>Mona</b><br>HOST<br><small id="hostStatus"></small></div>
    <div class="panel person"><div class="avatar">🧑</div><b>Aasil</b><br>CONTESTANT<br><small id="playerStatus"></small></div>
  </div>
  <div class="status" id="status">Waiting...</div>
  <button id="start" class="hidden" onclick="start()">🎬 Start Game</button>
  <div id="questionBox" class="hidden">
    <div class="status" id="qno"></div>
    <div class="question" id="q"></div>
    <div class="answers" id="answers"></div>
  </div>
  <div class="big hidden" id="winner">🏆 AASIL CROREPATI! 💰😂</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io(); let role=null, current=null, answered=false;
const $=id=>document.getElementById(id);

function create(){ socket.emit("createRoom",{name:$("hostName").value||"Mona"}); role="host"; }
function join(){ socket.emit("joinRoom",{code:$("roomCode").value,name:$("playerName").value||"Aasil"}); role="player"; }
function start(){socket.emit("startGame")}
socket.on("roomCreated",d=>enter(d.code));
socket.on("joined",d=>enter(d.code));
socket.on("errorMsg",m=>$("lobbyMsg").textContent=m);

function enter(code){
 $("lobby").classList.add("hidden"); $("game").classList.remove("hidden"); $("code").textContent=code;
 $("start").classList.toggle("hidden",role!=="host");
 $("status").textContent=role==="host"?"Aasil ke join hone ka wait...":"Mona ke start karne ka wait...";
}

socket.on("state",s=>{
 $("hostStatus").textContent=s.host?"🟢 Online":"🔴 Offline";
 $("playerStatus").textContent=s.player?"🟢 Online":"🔴 Waiting";
 if(role==="host" && s.player && !s.started) $("status").textContent="Aasil aa gaya! 🎉 Start dabao.";
});

socket.on("question",data=>{
 current=data; answered=false;
 $("questionBox").classList.remove("hidden"); $("winner").classList.add("hidden");
 $("qno").textContent=`Question ${data.number} / ${data.total}`;
 $("q").textContent=data.q; $("status").textContent=role==="host"?"Question live! 🎤":"Answer choose karo 👇";
 const box=$("answers"); box.innerHTML="";
 data.a.forEach((x,i)=>{
   const b=document.createElement("button"); b.textContent=String.fromCharCode(65+i)+") "+x;
   b.onclick=()=>answer(i,b); box.appendChild(b);
 });
});

function answer(i,b){
 if(role!=="player"||answered)return;
 answered=true; document.querySelectorAll("#answers button").forEach(x=>x.disabled=true);
 b.style.background="#d9ac2c";b.style.color="#111"; socket.emit("answer",{index:i});
}

socket.on("answerState",()=>{$("status").textContent="Aasil ne answer lock kar diya 🔒"});
socket.on("result",r=>{
 $("status").textContent=r.message;
 if(r.correct) setTimeout(()=>{$("status").textContent="🎉 Next question aa raha hai..."},700);
});
socket.on("winner",()=>{
 $("questionBox").classList.add("hidden"); $("winner").classList.remove("hidden");
 $("status").textContent="🎊 50/50 nahi — Aasil ne full game clear kar diya!";
});
</script>
</body>
</html>
